<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>구카와 login</title>
{% include "_icons.html" %}</head>
<body>
<h1>구카와 login</h1>
<form method="post" action="/login">
<input type="hidden" name="next" value="{{ next }}">
<p><input name="username" value="{{ username }}" aria-label="name" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></p>
<p><input name="password" type="password" aria-label="password" autocomplete="current-password" required></p>
<p><button type="submit">login</button></p>
</form>
</body></html>
