[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gukawa"
version = "0.1.0"
description = "Chiikawa episode archive with an automatic Korean subtitle pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1.6,<4",
  "python-dotenv>=1.0,<2", "httpx>=0.28,<1", "yt-dlp>=2025.1",
  "instaloader>=4.14,<5", "filelock>=3.18,<4", "pysubs2>=1.8,<2",
]

[project.optional-dependencies]
ocr = ["rapidocr==3.10.0", "onnxruntime>=1.20,<2", "opencv-python-headless>=4.10,<5"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["gukawa*"]

[tool.setuptools.package-data]
gukawa = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
